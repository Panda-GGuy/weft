modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0"
issueTrackerURL = "https://github.com/Panda-GGuy/weft/issues"

[[mods]]
modId = "weft"
version = "0.1.0-alpha"
displayName = "Weft"
description = '''
Multithreaded server engine for modded Minecraft.
Regionized world ticking + a graph scheduler for cross-chunk mod networks,
with a compatibility sandbox that runs unverified mods with exact
single-threaded semantics. See RFC-0001 in the repo.
'''
authors = "Panda-GGuy"

[[dependencies.weft]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.weft]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "weft.mixins.json"

# Optimization hooks are fail-soft (RFC-0003 R2): required=false +
# defaultRequire=0, with runtime applied-checks that self-disable the module.
[[mixins]]
config = "weft-optimizations.mixins.json"
