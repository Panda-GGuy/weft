name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: "Core (engine + api + sandbox)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test core modules
        run: gradle build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: '**/build/reports/tests/'

  neoforge:
    name: "NeoForge mod (1.21.1)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with NeoForge module
        run: gradle build -PwithNeoForge
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: weft-neoforge-jar
          path: weft-neoforge/build/libs/*.jar
