name: neighbors

# RFC-0003 R7: "CI boots the neighbors." Each cell boots a dedicated server
# with a stub jar carrying a known neighbor's modid (posture resolution keys
# on modid presence — see scripts/neighbors/) and asserts the expected R5
# posture table line plus a clean startup. Catches registry regressions and
# ladder-logic regressions with zero network dependence on real mod files.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  neighbor-boot:
    name: "boot with ${{ matrix.neighbor }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - neighbor: spark
            # Rung 1: two observers compose; the profiler stays active.
            expectations: 'profiler +ACTIVE|cooperating with spark'
          - neighbor: lithium
            # Rung 1: different levers on the same subsystems (see registry).
            expectations: 'pathfinding +ACTIVE|cooperating with lithium'
          - neighbor: asyncpathfinding
            # Rung 2: a dedicated async-pathfinding mod owns WS-2's territory.
            expectations: 'pathfinding +YIELDED|to asyncpathfinding'
          - neighbor: servercore
            # Rung 2, two territories. Entity Activation Range gates an
            # out-of-range entity's whole tick (Spigot/Paper semantics), which is
            # strictly wider than WS-1's AI-frequency throttling; and their
            # mob-spawning section mediates the mobcap inputs P1's spawn-density
            # service constructs. activationScheduling is enabled in the cell so
            # the WS-1 conflict actually resolves (a module that is off has no
            # territory claim); spawnDensityMode already defaults to
            # AUTHORITATIVE.
            expectations: 'activation +YIELDED|to servercore|spawn_density +YIELDED'
            weft_config: 'activationScheduling = true'
          - neighbor: scalablelux
            # Rung 1: a Starlight-derived light engine touches neither the
            # profiler nor spawn state, so both must stay ACTIVE and name it as a
            # cooperating neighbor - this cell's job is catching an *accidental*
            # yield. Its ws4_light row is inert until WS-4.3 exists, and its
            # regionized_ticking posture is deliberately unset pending RFC-0006's
            # light-engine audit item; extend this cell when either lands.
            expectations: 'profiler +ACTIVE|cooperating with scalablelux|spawn_density +ACTIVE'
          - neighbor: moonrise
            # Rung 2, issue #16. Moonrise's chunk-system rewrite asserted
            # main-thread execution from a Weft ForkJoin worker during a
            # parallel entity section and crashed the tick loop. Moonrise makes
            # no tick-ownership claim of its own (RESEARCH-0002 §1), so this is
            # a yield, not a refusal - and the point of the cell is the SECOND
            # and THIRD expectations, not the first: the config below asks for
            # the full parallel stack, and the boot must show it disarmed. A
            # posture line alone would not distinguish "Weft parked the module"
            # from "Weft relabelled it while workers still tick entities".
            expectations: 'regionized_ticking +YIELDED|to moonrise|sub-flags are DISARMED|parallelRegions'
            weft_config: |
              regionizedTicking = true
              partitionedTicking = true
              parallelRegions = true
          - neighbor: metrics-port
            # WS-7 / RFC-0009 §8.1. The only real conflict the observability
            # module has with a neighbouring exporter is a PORT COLLISION, and a
            # port collision is detected by binding rather than by modid — which
            # is why it also catches Bukkit plugins behind a proxy, unrelated
            # processes, and exporters that do not exist yet. Deliberately not a
            # registry row: two of the five known exporters are Bukkit plugins
            # with no modid, one has no 1.21.1 build, two have unverified modids,
            # and `cooperate` is already the default for unknown mods. So this
            # cell boots with the port already held and asserts the module yields
            # it, self-disables (rung 3) and leaves the server clean.
            # The stub modid is inert here; the port is the whole test.
            expectations: 'observability +SELF-DISABLED|already in use'
            occupy_port: '19940'
            weft_config: |
              [observability]
              metricsEnabled = true
              metricsPort = 19940
          - neighbor: forgia
            # Rung 4: a tick-ownership engine. regionizedTicking is enabled in
            # the cell's config so the conflict actually resolves (a module
            # that is off has no territory claim and stays quietly DISABLED).
            expectations: 'regionized_ticking +REFUSED|ownership conflict with forgia|conflicts with another installed mod'
            weft_config: 'regionizedTicking = true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot with stub neighbor and assert posture
        env:
          WEFT_CONFIG_TOML: ${{ matrix.weft_config || '' }}
          # WS-7's port-collision cell (RFC-0009 §8.1): hold the port before boot
          # so the module has to detect it by binding, and yield it.
          WEFT_OCCUPY_PORT: ${{ matrix.occupy_port || '' }}
        run: |
          IFS='|' read -ra EXPECT <<< "${{ matrix.expectations }}"
          bash scripts/neighbors/neighbor-boot-test.sh "${{ matrix.neighbor }}" "${EXPECT[@]}"
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neighbor-boot-${{ matrix.neighbor }}-log
          path: build/neighbors/*.log
