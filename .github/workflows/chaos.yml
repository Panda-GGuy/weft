name: chaos

# RFC-0001 §12: save corruption is the critical risk, and kill-tests run in
# CI "from P2 day one". Nightly + on demand: boots a dedicated server with
# Weft, repeatedly kill -9s it mid-save, and asserts the world recovers
# cleanly. See scripts/chaos/kill-save-test.sh for the assertions.

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

jobs:
  kill-during-save:
    name: "kill -9 during save, assert recovery"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run kill -9 recoverability harness
        run: bash scripts/chaos/kill-save-test.sh
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-server-logs
          path: build/chaos/*.log
