name: bench

# WS-8 (RFC-0002): the nightly benchmark gates.
#   jmh         - engine hot paths (mailboxes, merge/split, pipeline, graph).
#   world-bench - the reproducible benchmark world + headless GameTest load
#                 generator: WS-1 acceptance (2k passive + 500 hostile mobs,
#                 >=50% of the AI-step slice with a >=10% entity-phase
#                 floor, near-player parity) is asserted
#                 inside the gametest itself; the measured numbers join the
#                 same regression tracking as the JMH results.
# Results are recorded on the bench-data branch; a job FAILS when any
# benchmark regresses beyond the noise band vs the last recorded run. Shared
# runners are noisy, hence the generous 150% threshold - this gate catches
# real regressions (an accidental O(n^2), a new allocation storm), not 5%
# drift.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jmh:
    name: "JMH regression gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JMH suites
        run: gradle :weft-engine:jmh :weft-services:jmh --console=plain
      - name: Merge module results
        run: |
          jq -s 'add' \
            weft-engine/build/reports/jmh/results.json \
            weft-services/build/reports/jmh/results.json \
            > jmh-results.json
      - name: Compare against recorded baseline
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Weft JMH
          tool: 'jmh'
          output-file-path: jmh-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: bench-data
          benchmark-data-dir-path: dev/bench
          auto-push: true
          fail-on-alert: true
          alert-threshold: '150%'
          summary-always: true

  world-bench:
    name: "Benchmark world regression gate"
    runs-on: ubuntu-latest
    # Serialized after jmh: both jobs auto-push to the bench-data branch and
    # concurrent pushes race. Runs even when jmh's gate trips.
    needs: jmh
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the benchmark world (headless GameTest load generator)
        run: gradle :weft-neoforge:runGameTestServer -PwithNeoForge --console=plain
      - name: Show benchmark results
        if: always()
        run: cat weft-neoforge/run/gametest/weft-bench.json || true
      # WS-7 / RFC-0009 §10.1: the authoritative exposition-conformance gate.
      # promtool is the canonical Prometheus parser AND a naming/unit linter, so
      # this catches both malformed exposition (silent: a scraper records nothing
      # and nobody notices) and convention drift in the metric names. It runs
      # against the scrape the gametest captured from a real booted server, not a
      # synthetic fixture. The offline JUnit half is ExpositionFormatTest.
      - name: Verify exposition format with promtool
        run: |
          set -euo pipefail
          SCRAPE=weft-neoforge/run/gametest/weft-metrics-scrape.txt
          if [ ! -s "$SCRAPE" ]; then
            echo "::error::$SCRAPE is missing or empty - the observability gametest"
            echo "::error::did not capture a scrape, so exposition conformance is unverified."
            exit 1
          fi
          PROM_VERSION=3.13.2
          curl -sSfL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          PROMTOOL=/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool
          echo "Scraped $(grep -vc '^#' "$SCRAPE") series from the gametest server."
          # check metrics reads on stdin and exits nonzero on a parse error or a
          # lint violation (missing/incorrect unit suffix, counter without _total,
          # non-base units).
          "$PROMTOOL" check metrics < "$SCRAPE"
      - name: Upload the scrape for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weft-metrics-scrape
          path: weft-neoforge/run/gametest/weft-metrics-scrape.txt
          if-no-files-found: warn
      - name: Compare against recorded baseline
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Weft world bench
          tool: 'customSmallerIsBetter'
          output-file-path: weft-neoforge/run/gametest/weft-bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: bench-data
          benchmark-data-dir-path: dev/bench-world
          auto-push: true
          fail-on-alert: true
          alert-threshold: '150%'
          summary-always: true
